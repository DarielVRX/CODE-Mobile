plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.codemobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.codemobile"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            // Chaquopy requires at least one ABI; arm64 covers virtually all modern devices.
            abiFilters "arm64-v8a", "x86_64"
        }

        python {
            version "3.11"
        }
    }

    def hasReleaseSigningEnv = System.getenv("KEYSTORE_FILE") != null

    if (hasReleaseSigningEnv) {
        signingConfigs {
            release {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigningEnv) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // JavaScript engine, pure JVM, no NDK required: keeps the build reliable in CI.
    implementation 'org.mozilla:rhino:1.7.15'

    // Git puro JVM (clone/init/add/commit/push/pull/status/branch/checkout/
    // merge vía consola, ver com.codemobile.git.GitRepository). HTTPS con
    // Personal Access Token alcanza con el artefacto base, sin el módulo de
    // soporte SSH.
    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.9.0.202403050737-r'

    // EncryptedSharedPreferences: guarda el PAT de GitHub cifrado en disco.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Ejecutar operaciones git largas (clone/push/pull) en un hilo de fondo
    // desde GitForegroundService sin bloquear la UI (ver GitRepository).
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
